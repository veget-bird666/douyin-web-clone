spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:douyin_clone}?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}

douyin:
  jwt-secret: ${JWT_SECRET}
  jwt-expire-days: ${JWT_EXPIRE_DAYS:7}
  email-code-expire-seconds: ${EMAIL_CODE_EXPIRE_SECONDS:300}
  email-code-cooldown-seconds: ${EMAIL_CODE_COOLDOWN_SECONDS:30}
  mail-from-name: ${MAIL_FROM_NAME:抖音精选}
  mail-from-address: ${MAIL_FROM_ADDRESS}
  mail-smtp-domain: ${MAIL_SMTP_DOMAIN}
  mail-dev-log: false
